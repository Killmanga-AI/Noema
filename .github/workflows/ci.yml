name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-test:
    name: build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - run: dotnet restore
      - run: dotnet build --no-restore -c Release
      - name: Tests without Docker
        if: runner.os == 'Windows'
        run: dotnet test --no-build -c Release --filter "Category!=Docker"
      - name: All tests
        if: runner.os == 'Linux'
        run: dotnet test --no-build -c Release

  container:
    name: compose file and image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker compose --env-file .env.example config --quiet
      - run: docker build -f src/Noema.Api/Dockerfile -t noema-api:ci .

  publish-agent:
    name: publish agent (${{ matrix.rid }})
    needs: build-test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rid: [win-x64, linux-x64, linux-arm64]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Publish a self-contained single file agent
        run: >
          dotnet publish src/Noema.Agent/Noema.Agent.csproj
          -c Release -r ${{ matrix.rid }} --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None -o publish/${{ matrix.rid }}
      - uses: actions/upload-artifact@v4
        with:
          name: noema-agent-${{ matrix.rid }}
          path: publish/${{ matrix.rid }}
          if-no-files-found: error
